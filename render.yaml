services:
  - type: web
    name: multiple-disease-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "False"
